name: Beta bug report
description: Report a setup or practice problem in the Omagym beta.
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Omagym. Share only relevant error excerpts, without credentials or private source. For security issues, follow SECURITY.md instead of posting details here.
  - type: textarea
    id: environment
    attributes:
      label: Environment and installed commit
      description: Include your app commit (or plugin commit if setup failed), Omarchy version, Node/Python versions, editor, terminal, and enabled modules. See BETA.md for commands.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the project ID, command or button, and whether this was a new installation or an update.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and error
      description: Paste the relevant error or attach a screenshot after checking for private information. Mention any lost or changed work.
    validations:
      required: true
